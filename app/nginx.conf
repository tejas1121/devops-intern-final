# Runs as the unprivileged "nginx" user: every path NGINX writes to is under /tmp,
# and the server listens on 8080 because non-root users cannot bind ports below 1024.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Combined log format on stdout so Docker/Nomad (and therefore Promtail) can collect it.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile       on;
    server_tokens  off;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;

        # __BUILD_SHA__ is replaced with the git commit SHA at image build time.
        add_header X-Build-SHA "__BUILD_SHA__" always;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
