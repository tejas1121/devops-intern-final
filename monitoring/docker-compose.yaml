# Log aggregation stack: Loki (storage), Promtail (shipper), Grafana (UI).
# Start from the repository root:  docker compose -f monitoring/docker-compose.yaml up -d
name: monitoring

services:
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      # Override with GRAFANA_PORT=3001 if 3000 is already taken on the host.
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Anonymous admin is for local review only; see "Known Limitations" in the README.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
